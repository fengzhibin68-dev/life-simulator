name: 🐞 缺陷报告
description: 游戏或工程配置出现了不符合预期的行为
title: "fix: "
labels: ["type/fix"]
body:
  - type: markdown
    attributes:
      value: |
        尽量把信息补齐，能节省一半定位时间。如果是想法或需求，请改用「功能需求」模板。

  - type: textarea
    id: actual
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
      placeholder: |
        实际：第 3 年结束后面板数值不再刷新
        期望：每年结束后刷新年龄与属性
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 开始新游戏
        2. 连续选择「继续工作」三次
        3. 观察右侧属性面板
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 玩法 / 数值
        - 界面 / 表现
        - 存档 / 数据
        - 工程 / CI / 仓库配置
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 严重程度
      options:
        - 阻断（无法继续游戏）
        - 严重（主要功能不可用）
        - 一般（有替代方案）
        - 轻微（体验问题）
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 浏览器 / 系统 / 分支或提交号
      placeholder: Chrome 131 / Windows 11 / main@a1b2c3d

  - type: textarea
    id: extra
    attributes:
      label: 截图、日志或补充说明
      render: markdown
